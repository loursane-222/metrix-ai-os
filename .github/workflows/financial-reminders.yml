name: Financial Reminders

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch: {}

jobs:
  send-reminders:
    name: Send Financial Reminders
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Dispatch financial reminders
        run: |
          set +e
          RESPONSE=$(curl \
            --silent \
            --show-error \
            --fail-with-body \
            --max-time 60 \
            --request POST \
            --header "Authorization: Bearer ${{ secrets.FINANCIAL_REMINDER_CRON_SECRET }}" \
            --header "Content-Type: application/json" \
            "${{ secrets.METRIX_APP_URL }}/api/financial-reminders/run")
          CURL_EXIT=$?
          set -e

          echo "--- Financial Reminder Response ---"
          echo "$RESPONSE"

          if [ "$CURL_EXIT" -ne 0 ]; then
            exit "$CURL_EXIT"
          fi
