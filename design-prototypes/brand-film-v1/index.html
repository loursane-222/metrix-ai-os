<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>METRIX — Brand Film V1</title><link rel="stylesheet" href="brand-film.css"></head>
<body><main class="stage" data-state="ready"><div class="atmosphere" aria-hidden="true"><i></i><i></i><i></i></div><header class="identity"><span>METRIX</span><i></i><small>TANIŞMA FİLMİ</small></header>
  <section class="experience" aria-label="Metrix marka filmi">
    <div class="film-shell">
      <div class="video-surface" aria-label="Film önizlemesi">
        <img src="film-poster.png" alt="">
        <div class="film-tint" aria-hidden="true"></div>
        <div class="ready-cue"><button class="play-cue" type="button" aria-label="Filmi başlat"><span></span></button><p>METRIX ile tanışın</p></div>
        <div class="playing-cue" aria-hidden="true"><span>METRIX</span><i></i></div>
        <div class="paused-cue" aria-hidden="true"><span></span><p>Film duraklatıldı</p></div>
      </div>
      <div class="film-meta"><div><p class="eyebrow"><span></span>İLK DENEYİM</p><h1>METRIX’e kısa bir giriş</h1></div><p>Çalışma ortamınıza geçmeden önce METRIX’i yakından tanıyın.</p></div>
    </div>
    <p class="error" role="status" hidden>Film başlatılamadı. Doğrudan Metrix’e devam edebilirsiniz.</p>
    <div class="actions">
      <button class="primary" type="button"><span class="primary-icon"></span><b>Filmi Başlat</b></button>
      <button class="secondary" type="button">Şimdi Başla <span>→</span></button>
    </div>
  </section>
</main><script src="brand-film.js"></script></body></html>
