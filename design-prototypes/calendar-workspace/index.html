<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calendar Workspace V1</title><link rel="stylesheet" href="../shared.css"></head><body><main class="stage" data-state="CALENDAR_WORKSPACE"><button class="top-control left">☷</button><button class="top-control right">⚙</button><section class="workspace-shell calendar-shell"><div class="calendar-header"><h1>Takvim</h1><div class="calendar-tools"><button class="calendar-button">Bugün</button><button class="calendar-button calendar-nav" data-nav="prev">‹</button><button class="calendar-button calendar-nav" data-nav="next">›</button><strong id="period">Ağustos 2026</strong><div class="view-switch"><button data-view="month" class="active">Ay</button><button data-view="week">Hafta</button><button data-view="day">Gün</button></div></div><button class="close">×</button></div><div class="calendar-body" id="calendar-body"></div></section><div class="textbox" data-testid="textbox"><span class="plus">＋</span><span class="hint">METRIX’e bir şey sorun veya bir görev verin…</span><span class="mic">⌁</span><span class="send">↑</span></div></main><script src="calendar.js"></script></body></html>
