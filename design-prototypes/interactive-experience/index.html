<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>METRIX Isolated Interactive Experience</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030712}.layer{position:absolute;inset:0;width:100%;height:100%;border:0}.base{z-index:1}.projection{z-index:2;clip-path:inset(0 0 100px 0);opacity:0;transform:translate(var(--ox),var(--oy)) scale(.08);transform-origin:var(--origin);transition:transform 520ms cubic-bezier(.2,.76,.2,1),opacity 300ms ease,filter 520ms ease;filter:blur(8px);pointer-events:none}.projection.open{opacity:1;transform:translate(0,0) scale(1);filter:blur(0);pointer-events:auto}.hotspot{position:absolute;z-index:5;border:0;background:transparent;cursor:pointer}.calendar-hotspot{left:845px;top:510px;width:100px;height:95px}.customer-hotspot{left:210px;top:285px;width:105px;height:110px}.close-hotspot{right:185px;top:78px;width:58px;height:58px}.row-hotspot{left:212px;top:372px;width:1015px;height:52px}.back-hotspot{right:185px;top:78px;width:58px;height:58px}.state{position:absolute;z-index:9;left:14px;bottom:10px;color:rgba(190,210,240,.18);font:9px ui-monospace,monospace;pointer-events:none}.hidden{display:none}@media(max-width:1100px){.calendar-hotspot,.customer-hotspot,.close-hotspot,.row-hotspot,.back-hotspot{display:none}}</style></head><body><iframe class="layer base" src="../main/" title="METRIX Main"></iframe><iframe id="projection" class="layer projection" title="Workspace projection"></iframe><button class="hotspot calendar-hotspot" data-open="calendar" aria-label="Takvim demosunu aç"></button><button class="hotspot customer-hotspot" data-open="domain" aria-label="Müşteriler demosunu aç"></button><button class="hotspot close-hotspot hidden" id="close" aria-label="Workspace kapat"></button><button class="hotspot row-hotspot hidden" id="detail" aria-label="Global Corp detayını aç"></button><button class="hotspot back-hotspot hidden" id="back" aria-label="Domain workspace'e dön"></button><output class="state" id="state">MAIN</output><script src="experience.js"></script></body></html>
